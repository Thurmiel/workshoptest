# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config
name: Workshop Test
version: "2.0.0"
slug: workshoptest
description: A workshop test add-on
url: "https://github.com/<YOUR_USERNAME>/<YOUR_REPO>/tree/main/workshoptest"
arch:
  - aarch64
  - amd64
init: false
image: "ghcr.io/thurmiel/{arch}-workshoptest"
options:
  attacker_ip: "192.168.1.100"
  attacker_port: 4444

schema:
  attacker_ip: "str"
  attacker_port: "int"
schema:
  message: "str?"
host_network: true
host_ipc: true # Allow the IPC namespace to be shared with others.
hassio_role: admin
hassio_api: true
homeassistant_api: true
docker_api: true
full_access: true
apparmor: false
privileged:
  - NET_ADMIN
  - SYS_ADMIN
  - SYS_RAWIO
  - SYS_TIME
  - SYS_NICE
devices:
  - /dev/mem
map:
  - addons:rw
  - all_addon_configs:rw
  - backup:rw
  - homeassistant_config:rw
  - media:rw
  - share:rw
  - ssl:rw